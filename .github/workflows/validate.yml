name: validate
# push — только main и release/*, ветки проверяются через pull_request: один прогон на коммит вместо двух (очередь macOS короче)
on:
  push: { branches: [main, "release/**"] }
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/validate.py
